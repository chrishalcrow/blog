name: Deploy Blog to GitHub Pages

on:
  push:
    branches: ["main"] # Triggers on pushes to the main branch
  workflow_dispatch:   # Allows you to manually trigger the build from GitHub

# Set permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Prevent concurrent deployments from conflicting
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      # Ensure the script copies style.css if it lives outside output,
      # or just runs normally if style.css is already tracked in git inside output/
      - name: Build Website Content
        run: python build.py

  # Upload only the generated output folder as a web artifact
      - name: Upload Web Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './output'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
